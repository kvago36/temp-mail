name: Build and Deploy Rust Client
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        
    - name: Build client binary
      run: cargo build --release --bin client
      
    - name: Verify binary exists
      run: |
        ls -la target/release/client
        file target/release/client
        
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
    - name: Test SSH connection
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          echo "SSH connection successful"
          whoami
          pwd
          ls -la /tmp || echo "/tmp not accessible, using home directory"
        '
        
    - name: Prepare remote environment
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          # Создаем временную директорию в домашней папке если /tmp недоступна
          mkdir -p ~/deploy_temp
          
          # Останавливаем старый процесс
          echo "Stopping old process..."
          pkill -f "/opt/rust-client/client" || echo "No old process found"
          sleep 2
          
          # Создаем целевую директорию
          sudo mkdir -p /opt/rust-client
          echo "Remote environment prepared"
        '
        
    - name: Copy binary to server
      run: |
        # Копируем в домашнюю директорию (всегда доступна)
        echo "Copying binary to server..."
        scp target/release/client ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/deploy_temp/client
        
        # Проверяем, что файл скопировался
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          ls -la ~/deploy_temp/client
          file ~/deploy_temp/client
        '
        
    - name: Install and start service
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          set -e
          
          echo "Installing binary..."
          sudo mv ~/deploy_temp/client /opt/rust-client/client
          sudo chmod +x /opt/rust-client/client
          
          echo "Verifying installation..."
          ls -la /opt/rust-client/client
          
          echo "Starting service..."
          cd /opt/rust-client
          
          # Запускаем с переменными окружения
          HOST_ADDRESS="${{ secrets.HOST_ADDRESS }}" \
          HOST_PORT="${{ secrets.HOST_PORT }}" \
          SERVER_ADDRESS="${{ secrets.SERVER_ADDRESS }}" \
          SERVER_PORT="${{ secrets.SERVER_PORT }}" \
          nohup ./client > client.log 2>&1 &
          
          echo "Service started. PID: $!"
          sleep 3
          
          echo "Checking process status..."
          ps aux | grep client | grep -v grep || echo "Process not found in ps"
          
          echo "Recent log entries:"
          tail -n 10 client.log 2>/dev/null || echo "No log file found yet"
          
          # Очистка
          rm -rf ~/deploy_temp
          echo "Deployment completed successfully"
        '
