cargo-features = ["profile-rustflags"]

[package]
name = "mail"
version = "0.1.0"
edition = "2024"

[[bin]] # Bin to run the HelloWorld gRPC server
name = "server"
path = "src/bin/server.rs"

[[bin]] # Bin to run the HelloWorld gRPC client
name = "client"
path = "src/bin/client.rs"

[dependencies]
tokio = { version = "1.44.1", features = ["full"] }
actix-web = "4"
regex = "1.11.1"
chrono = "0.4.39"
thiserror = "2.0.12"
mailparse = "0.16.1"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "uuid", "chrono", "postgres", "migrate"] }
sqlx-postgres = "0.8.3"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
rand = "0.8.5"
serde_json = "1.0.140"
serde = "1.0.219"
actix-cors = "0.7.1"
log = "0.4.27"
simple_logger = "5.0.0"
cookie = "0.18.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls", "json"] }
actix-session = { version = "0.10.1", features = ["redis-session"] }
clap = { version = "4.5.46", features = ["derive", "env"] }

[profile.pi-release]
target = "aarch64-unknown-linux-gnu"
inherits = "release"

[profile.debug-vps]
opt-level = 1
debug = true
target = "x86_64-unknown-linux-gnu"
inherits = "dev"

[profile.vps]
opt-level = 1
debug = false
inherits = "release"