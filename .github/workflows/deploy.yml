name: Build and Deploy Rust Client
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        
    - name: Build client binary
      run: cargo build --release --bin client
      
    - name: Setup SSH with debugging
      env:
        SSH_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}  # Импорт фразы-пароля
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Сохраняем ключ с обработкой фразы-пароля
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Если ключ защищён фразой - разблокируем его
        if [ -n "$SSH_PASSPHRASE" ]; then
          echo "Key is passphrase-protected, unlocking..."
          ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_rsa || echo "Warning: Passphrase may be incorrect"
        fi
        
        # Отладочная информация
        echo "SSH key info:"
        ssh-keygen -l -f ~/.ssh/id_rsa || echo "ERROR: Invalid SSH key format"
        
        # Проверяем формат ключа
        head -n 1 ~/.ssh/id_rsa
        
        # Добавляем хост в known_hosts
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
        # Тестируем подключение
        echo "Testing SSH connection..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'echo "SSH connection successful"' || echo "SSH connection failed"
    
    - name: Deploy to server
      env:
        SSH_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}  # Повторно используем фразу
      run: |
        echo "Starting deployment..."
        
        # Копируем бинарник на сервер с отладкой
        echo "Copying binary to server..."
        if [ -n "$SSH_PASSPHRASE" ]; then
          # Если есть фраза - используем ssh-agent
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa <<< "$SSH_PASSPHRASE"
        fi
        
        scp -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            target/release/client \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/client
        
        # Устанавливаем и запускаем на сервере
        echo "Installing and starting service..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          set -e
          
          echo "Stopping old process..."
          pkill -f "/opt/rust-client/client" || true
          sleep 2
          
          echo "Setting up directories..."
          sudo mkdir -p /opt/rust-client
          
          echo "Installing new binary..."
          sudo mv /tmp/client /opt/rust-client/client
          sudo chmod +x /opt/rust-client/client
          
          echo "Starting new process..."
          cd /opt/rust-client
          
          HOST_ADDRESS="${{ secrets.HOST_ADDRESS }}" \
          HOST_PORT="${{ secrets.HOST_PORT }}" \
          SERVER_ADDRESS="${{ secrets.SERVER_ADDRESS }}" \
          SERVER_PORT="${{ secrets.SERVER_PORT }}" \
          nohup ./client > client.log 2>&1 &
          
          echo "Deployment completed. Process started."
          sleep 3
          
          echo "Checking process status..."
          ps aux | grep client | grep -v grep || echo "Warning: Process may not be running"
          
          echo "Recent log entries:"
          tail -n 10 client.log || echo "No log file found"
        '
