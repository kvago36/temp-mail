name: Build and Deploy Rust Client and Server
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        
    - name: Build client and server binaries
      run: |
        cargo build --release --bin client
        cargo build --release --bin server
      
    - name: Verify binaries exist
      run: |
        echo "=== Client binary ==="
        ls -la target/release/client
        file target/release/client
        echo "=== Server binary ==="
        ls -la target/release/server
        file target/release/server
        
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
    - name: Test SSH connection
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          echo "SSH connection successful"
          whoami
          pwd
          ls -la /tmp || echo "/tmp not accessible, using home directory"
        '
        
    - name: Prepare remote environment
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          # Создаем временную директорию в домашней папке если /tmp недоступна
          mkdir -p ~/deploy_temp
                    
          # Создаем целевую директорию
          sudo mkdir -p /opt/tempmail
          echo "Remote environment prepared"
        '
        
    - name: Copy binaries to server
      run: |
        # Копируем в домашнюю директорию (всегда доступна)
        echo "Copying binaries to server..."
        scp target/release/client ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/deploy_temp/client
        scp target/release/server ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/deploy_temp/server
        
        # Проверяем, что файлы скопировались
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
          echo "=== Client binary ==="
          ls -la ~/deploy_temp/client
          file ~/deploy_temp/client
          echo "=== Server binary ==="
          ls -la ~/deploy_temp/server
          file ~/deploy_temp/server
        '
