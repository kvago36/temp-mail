- name: Deploy to server
  run: |
    # Копируем бинарник
    scp -o StrictHostKeyChecking=no \
        target/release/client \
        ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/client_new

    # Останавливаем, удаляем старый и запускаем новый
    ssh -o StrictHostKeyChecking=no \
        ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
        # Останавливаем старый процесс
        pkill -f "~/rust-app/client" || true
        sleep 1
        
        # Удаляем старый файл
        rm -f ~/rust-app/client
        
        # Перемещаем новый
        mkdir -p ~/rust-app
        mv /tmp/client_new ~/rust-app/client
        chmod +x ~/rust-app/client
        
        # Запускаем
        cd ~/rust-app
        HOST_ADDRESS="${{ secrets.HOST_ADDRESS }}" \
        HOST_PORT="${{ secrets.HOST_PORT }}" \
        SERVER_ADDRESS="${{ secrets.SERVER_ADDRESS }}" \
        SERVER_PORT="${{ secrets.SERVER_PORT }}" \
        nohup ./client > app.log 2>&1 &
        
        echo "✅ App restarted successfully"
        '
